<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Georgia, serif">
<rect width="1280" height="800" fill="#f7f3e8"/>
<text x="640" y="40" font-size="26" text-anchor="middle" fill="#2a2118" font-weight="bold">Parking Pulse — Wiring Diagram</text>
<text x="640" y="64" font-size="14" text-anchor="middle" fill="#6a5b46">Two wall plugs. Signal flows Pi → level shifter → LEDs. All grounds meet on one common bus.</text>

<!-- legend -->
<g font-size="13" fill="#2a2118">
<rect x="40" y="80" width="470" height="30" fill="none"/>
<line x1="50" y1="95" x2="80" y2="95" stroke="#cc3333" stroke-width="4"/><text x="86" y="99">+12V</text>
<line x1="150" y1="95" x2="180" y2="95" stroke="#e8932e" stroke-width="4"/><text x="186" y="99">5V</text>
<line x1="230" y1="95" x2="260" y2="95" stroke="#3a9a4f" stroke-width="4"/><text x="266" y="99">data 3.3V</text>
<line x1="350" y1="95" x2="380" y2="95" stroke="#2f6fd0" stroke-width="4"/><text x="386" y="99">data 5V</text>
<line x1="450" y1="95" x2="480" y2="95" stroke="#222" stroke-width="4"/><text x="486" y="99">ground</text>
</g>

<!-- ===== boxes ===== -->
<g stroke="#46361f" stroke-width="2">
<rect x="70" y="150" width="240" height="66" rx="8" fill="#eadfc6"/>
<rect x="870" y="150" width="330" height="66" rx="8" fill="#eadfc6"/>
<rect x="70" y="300" width="300" height="210" rx="10" fill="#e9dcc0"/>
<rect x="500" y="330" width="250" height="160" rx="10" fill="#e9dcc0"/>
<rect x="870" y="300" width="330" height="200" rx="10" fill="#e9dcc0"/>
</g>
<g font-size="15" fill="#2a2118" font-weight="bold" text-anchor="middle">
<text x="190" y="190">Official 5V USB-C Supply</text>
<text x="1035" y="183">12V 5A Supply</text>
<text x="220" y="332">Raspberry Pi</text>
<text x="625" y="356">74AHCT125</text>
<text x="1035" y="330">LED String — 45× WS2811</text>
</g>
<g font-size="12" fill="#6a5b46" text-anchor="middle">
<text x="1035" y="202">(barrel → JST-SM pigtail)</text>
<text x="625" y="374">level shifter</text>
<text x="1035" y="348">(JST-SM in: +12V / DATA / GND)</text>
</g>

<!-- LED pixels illustration -->
<g fill="none"/>
<g>
<circle cx="930" cy="430" r="9" fill="#b8860b" stroke="#46361f"/>
<circle cx="985" cy="430" r="9" fill="#3c6e50" stroke="#46361f"/>
<circle cx="1040" cy="430" r="9" fill="#a6543c" stroke="#46361f"/>
<circle cx="1095" cy="430" r="9" fill="#5a6aa0" stroke="#46361f"/>
<circle cx="1150" cy="430" r="9" fill="#86548a" stroke="#46361f"/>
<line x1="939" y1="430" x2="976" y2="430" stroke="#888" stroke-width="2"/>
<line x1="994" y1="430" x2="1031" y2="430" stroke="#888" stroke-width="2"/>
<line x1="1049" y1="430" x2="1086" y2="430" stroke="#888" stroke-width="2"/>
<line x1="1104" y1="430" x2="1141" y2="430" stroke="#888" stroke-width="2"/>
<text x="1035" y="468" font-size="11" fill="#6a5b46" text-anchor="middle">…45 pixels chained, single data wire…</text>
</g>

<!-- ===== pins (small circles) ===== -->
<g fill="#2a2118" font-size="12">
<!-- Pi pins right edge x=370 -->
<circle cx="370" cy="360" r="4"/><text x="356" y="356" text-anchor="end">5V pin</text>
<circle cx="370" cy="405" r="4"/><text x="356" y="401" text-anchor="end">GPIO18</text>
<circle cx="370" cy="450" r="4"/><text x="356" y="446" text-anchor="end">GND pin</text>
<!-- shifter pins -->
<circle cx="500" cy="400" r="4"/><text x="508" y="396">IN</text>
<circle cx="750" cy="410" r="4"/><text x="742" y="404" text-anchor="end">OUT</text>
<circle cx="625" cy="330" r="4"/><text x="632" y="324">VCC</text>
<circle cx="625" cy="490" r="4"/><text x="632" y="505">GND</text>
<text x="625" y="430" font-size="11" fill="#6a5b46" text-anchor="middle">OE → GND</text>
<text x="625" y="446" font-size="11" fill="#6a5b46" text-anchor="middle">(jumper)</text>
<!-- LED JST pins left edge x=870 -->
<circle cx="870" cy="370" r="4"/><text x="862" y="366" text-anchor="end">+12V</text>
<circle cx="870" cy="410" r="4"/><text x="862" y="406" text-anchor="end">DATA</text>
<circle cx="870" cy="450" r="4"/><text x="862" y="446" text-anchor="end">GND</text>
<!-- 12V supply pins -->
<circle cx="960" cy="216" r="4"/><text x="952" y="234" text-anchor="end">+</text>
<circle cx="1110" cy="216" r="4"/><text x="1118" y="234">−</text>
</g>

<!-- ===== wires ===== -->
<!-- 5V supply to Pi USB-C -->
<polyline points="160,216 160,300" fill="none" stroke="#222" stroke-width="3"/>
<text x="168" y="262" font-size="12" fill="#2a2118">USB-C power</text>
<!-- Pi 5V -> shifter VCC -->
<polyline points="370,360 440,360 440,300 625,300 625,330" fill="none" stroke="#e8932e" stroke-width="3"/>
<text x="455" y="294" font-size="12" fill="#b9701a">5V → VCC</text>
<!-- Pi GPIO18 -> shifter IN -->
<polyline points="370,405 460,405 460,400 500,400" fill="none" stroke="#3a9a4f" stroke-width="3"/>
<text x="392" y="396" font-size="12" fill="#27713a">data 3.3V</text>
<!-- shifter OUT -> LED DATA -->
<polyline points="750,410 870,410" fill="none" stroke="#2f6fd0" stroke-width="3"/>
<text x="772" y="402" font-size="12" fill="#2153a0">data 5V</text>
<!-- 12V + -> LED +12V -->
<polyline points="960,216 960,260 835,260 835,370 870,370" fill="none" stroke="#cc3333" stroke-width="3"/>
<text x="845" y="300" font-size="12" fill="#a82828">+12V</text>
<!-- ground bus -->
<line x1="340" y1="640" x2="1110" y2="640" stroke="#222" stroke-width="5"/>
<text x="725" y="664" font-size="13" fill="#2a2118" text-anchor="middle" font-weight="bold">COMMON GROUND  —  join with a Wago: Pi GND • shifter GND • LED GND • 12V (−)</text>
<!-- drops to bus -->
<polyline points="370,450 370,640" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="625,490 625,640" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="870,450 870,640" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="1110,216 1110,640" fill="none" stroke="#222" stroke-width="3"/>

<!-- caution -->
<rect x="70" y="700" width="1140" height="74" rx="8" fill="#fbeede" stroke="#a82828" stroke-width="1.5"/>
<text x="86" y="724" font-size="14" fill="#a82828" font-weight="bold">Before powering on:</text>
<text x="86" y="746" font-size="13" fill="#5a4632">1) 12V touches ONLY the LED +12V and its ground — never the Pi.   2) All grounds must be joined (common bus) or the data won't read.</text>
<text x="86" y="765" font-size="13" fill="#5a4632">3) Match JST-SM wires by COLOR/label, not pin position.   4) Data arrow on the string must point AWAY from the end you feed.</text>
</svg>
